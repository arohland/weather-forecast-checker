# Builds the container image. Pull requests only build it (proving that the
# Dockerfile, renv.lock and package still produce a working image, including
# the image's own "no toolchain" and "package loads" checks); pushes to main
# also push it to Artifact Registry. Deployment to Cloud Run stays manual.
#
# Authentication uses Workload Identity Federation, so no service account key
# is stored in GitHub. Set these repository variables (Settings > Secrets and
# variables > Actions > Variables) from the Terraform outputs:
#   GCP_PROJECT_ID, GCP_REGION, ARTIFACT_REGISTRY_REPOSITORY,
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CI_SERVICE_ACCOUNT
name: docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - DESCRIPTION
      - NAMESPACE
      - renv.lock
      - "R/**"
      - "inst/**"
      - "exec/**"
      - .github/workflows/docker.yaml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to request the OIDC token for Workload Identity Federation.
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/wxpipe
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build (and on main, push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          # Images are tagged with the commit they were built from; the Cloud
          # Run Job is pointed at a specific tag when deploying.
          tags: ${{ env.PUSH == 'true' && format('{0}:{1}', env.IMAGE, github.sha) || format('wxpipe:ci-{0}', github.sha) }}
          build-args: WXPIPE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
